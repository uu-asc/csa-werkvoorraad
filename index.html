<script type="module">
    function processTimestamps() {
        document.querySelectorAll(".timestamp").forEach(processTimestamp)
        document.querySelectorAll(".timestamp-warning").forEach(processTimestampWarning)
    }

    function formatTimestamp(date, locale = "nl-NL") {
        return date.toLocaleString(locale, {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }).replace(",", "")
    }

    function processTimestamp(element) {
        const isoTime = element.getAttribute("data-timestamp")
        const locale = element.getAttribute("data-locale") ?? "nl-NL"

        if (!isoTime) return

        const date = new Date(isoTime)
        const formatted = formatTimestamp(date, locale)
        element.textContent = formatted
    }

    function processTimestampWarning(element) {
        const isoTime = element.getAttribute("data-timestamp")
        const thresholdHours = parseFloat(element.getAttribute("data-threshold") ?? "4")

        if (!isoTime) return

        const date = new Date(isoTime)
        const warningInfo = calculateWarning(date, thresholdHours)

        if (warningInfo.shouldWarn) {
            element.textContent = warningInfo.message
            element.className = `timestamp-warning ${warningInfo.severity}`
        }
    }

    function calculateWarning(date, thresholdHours) {
        const labels = {
            hour: "uur",
            hours: "uren",
            day: "dag",
            days: "dagen",
        }

        const now = new Date()
        const diffMs = now - date
        const diffHours = diffMs / (1000 * 60 * 60)

        if (diffHours <= thresholdHours) {
            return { shouldWarn: false }
        }

        const timeAgo = diffHours < 24
            ? `${Math.round(diffHours)} ${diffHours === 1 ? labels.hour : labels.hours}`
            : `${Math.floor(diffHours / 24)} ${Math.floor(diffHours / 24) === 1 ? labels.day : labels.days}`

        const severity =
            diffHours > 24 ? "severe" :
            diffHours > 8 ? "moderate" : "mild"

        return {
            shouldWarn: true,
            message: `LET OP! Laatste update was ${timeAgo} geleden`,
            severity: `timestamp-warning-${severity}`
        }
    }

    processTimestamps()
</script>

                ? node.classList.remove("hidden")

<script type="module">
    function addBorderToRowspans(table) {
        table.querySelectorAll("th[rowspan]").forEach(
            th => {
                const row = th.closest("tr")
                if (row.matches(":first-child")) { return }
                row.style.borderTop = "1px solid var(--color-text)"
            }
        )
    }

    function addBorderToColspans(table) {
        const borderCols = []
        table.querySelectorAll(`thead tr:first-child th.col_heading[colspan]`).forEach(
            th => {
                if (th.matches(".col_heading.col0")) { return }
                const col = Array.from(th.classList).find(cls => /^col\d+$/.test(cls))
                borderCols.push(col)
            }
        )
        borderCols.forEach(col => {
            table.querySelectorAll(`.${col}`).forEach(
                col => col.style.borderLeft = "1px solid var(--color-text)"
            )
        })
    }

    document.querySelectorAll("table").forEach(addBorderToRowspans)
    document.querySelectorAll("table").forEach(addBorderToColspans)
</script>
<script>
    const showOnPx = 100
    const backToTopButton = document.querySelector(".back-to-top")

    const scrollContainer = () => {
        return document.documentElement || document.body
    }

    const goToTop = () => {
        document.body.scrollIntoView({
            behavior: "smooth",
        })
    }

    document.addEventListener("scroll", () => {
        if (scrollContainer().scrollTop > showOnPx) {
            backToTopButton.classList.remove("hidden")
        } else {
            backToTopButton.classList.add("hidden")
        }
    })

    backToTopButton.addEventListener("click", goToTop)
</script>
